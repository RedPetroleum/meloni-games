<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101913">
  <title>Snake — Meloni Games</title>
  <style>
    :root { color-scheme: dark; --bg:#101913; --panel:#1b2a20; --line:#314838; --lime:#b8f36b; --mint:#78d7a1; --text:#eff7e8; --muted:#a3b39e; --red:#ff786b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; background:radial-gradient(ellipse at 50% 0%,#243829 0%,var(--bg) 64%); color:var(--text); font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif; }
    main { width:min(100%,460px); }
    .brand { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:0 2px 12px; }
    h1 { margin:0; font-size:clamp(24px,7vw,32px); letter-spacing:.02em; }
    .tag { color:var(--muted); font-size:12px; letter-spacing:.14em; text-transform:uppercase; }
    .cabinet { padding:14px; border:1px solid #3b5541; border-radius:18px; background:linear-gradient(145deg,#223428,#18251c); box-shadow:0 22px 70px #0008,inset 0 1px #ffffff12; }
    .stats { display:flex; justify-content:space-between; margin:0 3px 10px; font-weight:750; letter-spacing:.08em; font-size:12px; }
    .stats span { color:var(--muted); }
    .stats b { color:var(--lime); margin-left:5px; }
    canvas { display:block; width:100%; height:auto; aspect-ratio:4/3; border:1px solid #405d45; border-radius:8px; background:#0e1711; image-rendering:pixelated; }
    .legend { margin:7px 3px 0; color:var(--muted); font-size:11px; text-align:center; }
    .actions { display:flex; gap:9px; margin-top:12px; }
    button { appearance:none; border:1px solid #45614a; background:#26392b; color:var(--text); border-radius:10px; min-height:42px; padding:9px 13px; font:inherit; font-weight:700; cursor:pointer; touch-action:manipulation; }
    button:hover { background:#304a36; border-color:#759b67; }
    button:active { transform:translateY(1px); }
    #start { flex:1; background:var(--lime); border-color:var(--lime); color:#142014; }
    #start:hover { background:#c9fa8c; }
    .help { color:var(--muted); margin:12px 3px 0; font-size:12px; text-align:center; }
    .pad { display:none; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(2,42px); justify-content:center; gap:5px; margin:13px auto 0; }
    .pad button { padding:0; min-height:42px; font-size:18px; }
    .pad [data-dir="up"] { grid-column:2; }
    .pad [data-dir="left"] { grid-column:1; grid-row:2; }
    .pad [data-dir="down"] { grid-column:2; grid-row:2; }
    .pad [data-dir="right"] { grid-column:3; grid-row:2; }
    @media (pointer:coarse) { .pad { display:grid; } }
    @media (max-width:380px) { body { padding:12px; } .cabinet { padding:10px; } }
  </style>
</head>
<body>
  <main>
    <header class="brand"><h1>Snake</h1><span class="tag">Meloni Games · 01</span></header>
    <section class="cabinet" aria-label="Snake-Spiel">
      <div class="stats"><span>PUNKTE <b id="score">00</b></span><span>BEST <b id="best">00</b></span></div>
      <canvas id="screen" width="320" height="240" aria-label="Spielfeld"></canvas>
      <p class="legend">Rot = Futter · Der Rand ist eine Wand.</p>
      <div class="actions">
        <button id="start" type="button">Spiel starten</button>
        <button id="pause" type="button" aria-label="Pausieren">Pause</button>
      </div>
      <div class="pad" aria-label="Steuerkreuz">
        <button type="button" data-dir="up" aria-label="Hoch">▲</button>
        <button type="button" data-dir="left" aria-label="Links">◀</button>
        <button type="button" data-dir="down" aria-label="Runter">▼</button>
        <button type="button" data-dir="right" aria-label="Rechts">▶</button>
      </div>
    </section>
    <p class="help">Pfeiltasten oder WASD · Leertaste pausiert · Enter startet neu</p>
  </main>
  <script>
    "use strict";
    const canvas = document.querySelector("#screen");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.querySelector("#score");
    const bestEl = document.querySelector("#best");
    const startButton = document.querySelector("#start");
    const pauseButton = document.querySelector("#pause");
    const COLS = 20, ROWS = 13, CELL = 16, TOP = 16;
    const COLORS = { bg:"#0e1711", grid:"#17251a", snake:"#b8f36b", head:"#e2ffad", food:"#ff786b", text:"#eff7e8", muted:"#a3b39e" };
    const DIRS = {
      up:{x:0,y:-1}, right:{x:1,y:0}, down:{x:0,y:1}, left:{x:-1,y:0}
    };
    let snake, direction, queued, food, score, best, state, timer, tickMs;

    function readBest() {
      try { return Number(localStorage.getItem("meloni-snake-best")) || 0; }
      catch { return 0; }
    }
    function writeBest(value) {
      try { localStorage.setItem("meloni-snake-best", String(value)); } catch {}
    }
    function reset() {
      snake = [{x:8,y:6},{x:7,y:6},{x:6,y:6},{x:5,y:6}];
      direction = DIRS.right;
      queued = direction;
      score = 0;
      tickMs = 260;
      food = placeFood();
      state = "ready";
      render();
      updateUI();
    }
    function placeFood() {
      let p;
      do { p = { x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS) }; }
      while (snake && snake.some(part => part.x===p.x && part.y===p.y));
      return p;
    }
    function updateUI() {
      scoreEl.textContent = String(score).padStart(2,"0");
      bestEl.textContent = String(best).padStart(2,"0");
      startButton.textContent = state==="playing" ? "Neustart" : state==="paused" ? "Weiter" : state==="over" ? "Nochmal spielen" : "Spiel starten";
      pauseButton.textContent = state==="paused" ? "Weiter" : "Pause";
    }
    function start() {
      if (state==="playing" || state==="over") { reset(); }
      state = "playing";
      clearInterval(timer);
      timer = setInterval(step, tickMs);
      render();
      updateUI();
    }
    function togglePause() {
      if (state==="playing") {
        state = "paused"; clearInterval(timer);
      } else if (state==="paused") {
        state = "playing"; timer = setInterval(step, tickMs);
      } else if (state==="ready" || state==="over") start();
      render(); updateUI();
    }
    function setDirection(name) {
      const next = DIRS[name];
      if (!next || state==="over") return;
      if (state==="ready") start();
      if ((next.x === -direction.x && next.y === -direction.y) ||
          (next.x === -queued.x && next.y === -queued.y)) return;
      queued = next;
    }
    function step() {
      direction = queued;
      const head = {x:snake[0].x+direction.x, y:snake[0].y+direction.y};
      const ate = head.x===food.x && head.y===food.y;
      const bodyToCheck = ate ? snake : snake.slice(0,-1);
      if (head.x<0 || head.x>=COLS || head.y<0 || head.y>=ROWS || bodyToCheck.some(p=>p.x===head.x && p.y===head.y)) {
        state = "over"; clearInterval(timer); render(); updateUI(); return;
      }
      snake.unshift(head);
      if (ate) {
        score += 1;
        if (score>best) { best=score; writeBest(best); }
        if (score%5===0 && tickMs>150) {
          tickMs -= 15;
          clearInterval(timer);
          timer = setInterval(step,tickMs);
        }
        food = placeFood();
      } else snake.pop();
      render(); updateUI();
    }
    function roundedCell(x,y,color,inset=2) {
      const px=x*CELL+inset, py=TOP+y*CELL+inset, size=CELL-inset*2;
      ctx.fillStyle=color;
      ctx.beginPath();
      ctx.roundRect(px,py,size,size,4);
      ctx.fill();
    }
    function overlay(title, line1, line2) {
      ctx.fillStyle="#09120ddc";
      ctx.fillRect(20,77,280,86);
      ctx.strokeStyle="#638651";
      ctx.lineWidth=1;
      ctx.strokeRect(20.5,77.5,279,85);
      ctx.textAlign="center";
      ctx.fillStyle=COLORS.head;
      ctx.font="bold 18px system-ui, sans-serif";
      ctx.fillText(title,160,107);
      ctx.fillStyle=COLORS.text;
      ctx.font="12px system-ui, sans-serif";
      ctx.fillText(line1,160,130);
      ctx.fillStyle=COLORS.muted;
      ctx.font="10px system-ui, sans-serif";
      ctx.fillText(line2,160,148);
    }
    function render() {
      ctx.fillStyle=COLORS.bg; ctx.fillRect(0,0,320,240);
      ctx.strokeStyle=COLORS.grid; ctx.lineWidth=1;
      for (let x=0;x<=COLS;x++) { ctx.beginPath(); ctx.moveTo(x*CELL+.5,TOP); ctx.lineTo(x*CELL+.5,TOP+ROWS*CELL); ctx.stroke(); }
      for (let y=0;y<=ROWS;y++) { ctx.beginPath(); ctx.moveTo(0,TOP+y*CELL+.5); ctx.lineTo(320,TOP+y*CELL+.5); ctx.stroke(); }
      ctx.fillStyle=COLORS.food;
      ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2,TOP+food.y*CELL+CELL/2,5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#ffb3a6";
      ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2-1,TOP+food.y*CELL+CELL/2-1,1.3,0,Math.PI*2); ctx.fill();
      snake.forEach((part,i)=>roundedCell(part.x,part.y,i===0?COLORS.head:COLORS.snake,i===0?1:2));
      if (state==="ready") overlay("BEREIT?", "Fang das Futter und wachse.", "Drücke eine Richtung oder Start");
      if (state==="paused") overlay("PAUSE", "Gut durchatmen.", "Leertaste oder Weiter zum Fortsetzen");
      if (state==="over") overlay("GAME OVER", "Punkte: "+score+"   ·   Best: "+best, "Enter oder Nochmal spielen");
    }
    const keyMap = {ArrowUp:"up",w:"up",W:"up",ArrowRight:"right",d:"right",D:"right",ArrowDown:"down",s:"down",S:"down",ArrowLeft:"left",a:"left",A:"left"};
    document.addEventListener("keydown", event => {
      if (keyMap[event.key]) { event.preventDefault(); setDirection(keyMap[event.key]); return; }
      if (event.code==="Space") { event.preventDefault(); togglePause(); return; }
      if (event.key==="Enter") { event.preventDefault(); if (state==="playing") reset(); start(); }
    });
    document.querySelectorAll("[data-dir]").forEach(button => {
      button.addEventListener("pointerdown", event => { event.preventDefault(); setDirection(button.dataset.dir); });
    });
    startButton.addEventListener("click", () => state==="paused" ? togglePause() : start());
    pauseButton.addEventListener("click", togglePause);
    let touchStart=null;
    canvas.addEventListener("touchstart", event => { const t=event.changedTouches[0]; touchStart={x:t.clientX,y:t.clientY}; }, {passive:true});
    canvas.addEventListener("touchend", event => {
      if (!touchStart) return;
      const t=event.changedTouches[0], dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y;
      if (Math.max(Math.abs(dx),Math.abs(dy))>18) setDirection(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up"));
      touchStart=null;
    }, {passive:true});
    best=readBest();
    reset();
  </script>
</body>
</html>
