name: Build Snake GBC ROM

on:
  push:
    paths:
      - "snake/**"
      - ".github/workflows/build-snake.yml"
  pull_request:
    paths:
      - "snake/**"
      - ".github/workflows/build-snake.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GBDK-2020 4.5.0
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz \
            --output "$RUNNER_TEMP/gbdk.tar.gz"
          mkdir -p "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/gbdk.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gbdk/bin" >> "$GITHUB_PATH"
          test -x "$RUNNER_TEMP/gbdk/bin/lcc"
      - name: Build ROM
        run: make -C snake clean all GBDK_HOME="$RUNNER_TEMP/gbdk"
      - name: Validate Game Boy Color compatible ROM
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rom = Path("snake/snake.gbc").read_bytes()
          assert len(rom) >= 32768, f"ROM too small: {len(rom)} bytes"
          assert rom[0x134:0x139] == b"SNAKE", "unexpected ROM title"
          assert rom[0x143] & 0x80, "Game Boy Color compatibility flag is missing"
          print(f"Valid GBC-compatible ROM: {len(rom)} bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: meloni-snake-gbc
          path: snake/snake.gbc
          if-no-files-found: error
      - name: Commit built ROM
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake/snake.gbc
          if git diff --cached --quiet; then
            echo "ROM is already up to date"
          else
            git commit -m "Add built Snake GBC ROM"
            git push
          fi
