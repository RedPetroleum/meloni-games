name: Build, test and release games

# Every push builds and tests all games. On main the result is published as the release
# "latest", which the "Update games" entry on the HU-086 downloads.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages_prep.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Build runner
        run: make runner

      - name: Test games (headless)
        run: make test

      - name: Build release files
        run: make dist

      # Alle Spiele im Browser: dieselbe Engine als WebAssembly, eine HTML-Datei.
      # Schlägt das fehl, erscheint das Release für die Konsole trotzdem.
      - name: Build web player
        continue-on-error: true
        run: |
          command -v clang >/dev/null && command -v wasm-ld >/dev/null || \
            { sudo apt-get update -q && sudo apt-get install -y -q clang lld; }
          make web
          cp build/web/meloni-konsole.html dist/

      # Browser-Version für GitHub Pages: feste HTTPS-Adresse, damit Spielstände (localStorage)
      # erhalten bleiben, auch als Web-App auf dem iOS-Home-Bildschirm.
      - name: Prepare GitHub Pages
        id: pages_prep
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && hashFiles('build/web/meloni-konsole.html') != ''
        run: |
          mkdir -p build/pages
          cp build/web/meloni-konsole.html build/pages/index.html
          touch build/pages/.nojekyll

      - name: Upload GitHub Pages artifact
        if: steps.pages_prep.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

      - uses: actions/upload-artifact@v4
        with:
          name: meloni-games
          path: |
            dist/
            build/screens/
          if-no-files-found: error

      - name: Publish release "latest"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Meloni Games (latest)" \
              --notes "Built automatically from main. The HU-086 downloads this with 'Update games'."
          # Game files first, the manifest last, so a device never sees a manifest whose files are missing
          find dist -type f ! -name manifest.json -print0 | xargs -0 gh release upload latest --clobber
          gh release upload latest dist/manifest.json --clobber
          # Remove files that are no longer built
          for asset in $(gh release view latest --json assets --jq '.assets[].name'); do
            [ -e "dist/$asset" ] || gh release delete-asset latest "$asset" --yes
          done

  # Veröffentlicht die Browser-Version unter https://redpetroleum.github.io/meloni-games/
  # Einmalig nötig: Settings → Pages → Source: "GitHub Actions".
  pages:
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
